name: zpi-backend
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: zpi
      POSTGRES_USER: zpi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zpi_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zpi -d zpi"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
