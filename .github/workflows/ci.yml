name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: zpi
          POSTGRES_USER: zpi
          POSTGRES_PASSWORD: zpi_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zpi -d zpi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.10.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ZPI_TEST_DATABASE: Host=localhost;Port=5432;Database=zpi;Username=zpi;Password=zpi_ci
      ZPI_TEST_REDIS: localhost:6379,abortConnect=false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Zpi.slnx
      - run: dotnet build Zpi.slnx -c Release --no-restore
      - run: dotnet test Zpi.slnx -c Release --no-build
