name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: write
    env:
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.COMMIT_SHA }}
      - id: short
        run: echo "sha=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.short.outputs.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deployment
        id: trigger
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          response=$(curl --fail-with-body -sS "$COOLIFY_WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN")
          echo "$response"
          echo "deployment_uuid=$(jq -r '.deployments[0].deployment_uuid' <<< "$response")" >> "$GITHUB_OUTPUT"

      - name: Wait for Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          base_url="${COOLIFY_WEBHOOK%%/api/*}"
          for _ in $(seq 1 60); do
            status=$(curl -sS "$base_url/api/v1/deployments/$DEPLOYMENT_UUID" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" | jq -r '.status')
            echo "Coolify deployment status: $status"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled*) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for deployment"
          exit 1
